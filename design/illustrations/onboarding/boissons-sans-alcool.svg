<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <clipPath id="vignette-terrasse"><rect x="4" y="4" width="88" height="88" rx="16"/></clipPath>
