    </g>
    <g fill="#16764A"><circle cx="9.5" cy="22" r="5.5"/><circle cx="31.5" cy="22" r="5.5"/><circle cx="53.5" cy="22" r="5.5"/><circle cx="75.5" cy="22" r="5.5"/></g>
    <g fill="#FFFFFF"><circle cx="20.5" cy="22" r="5.5"/><circle cx="42.5" cy="22" r="5.5"/><circle cx="64.5" cy="22" r="5.5"/><circle cx="86.5" cy="22" r="5.5"/></g>
